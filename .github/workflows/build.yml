name: Build and release Caddy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install xcaddy
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest

      - name: Build Caddy
        run: |
          "$(go env GOPATH)/bin/xcaddy" build \
            --with github.com/caddyserver/forwardproxy=github.com/klzgrad/forwardproxy@naive \
            --with github.com/caddy-dns/cloudflare \
            --output caddy-linux-amd64

      - name: Verify modules
        run: |
          chmod +x caddy-linux-amd64
          ./caddy-linux-amd64 version
          ./caddy-linux-amd64 list-modules | grep -E 'forward_proxy|dns.providers.cloudflare'

      - name: Create SHA256 checksum
        run: sha256sum caddy-linux-amd64 > SHA256SUMS

      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: caddy-naive-dns
          name: Latest Caddy build
          body: |
            Custom Caddy build for Linux amd64.

            Included modules:
            - NaiveProxy forward proxy: `github.com/klzgrad/forwardproxy@naive`
            - Cloudflare DNS-01 provider: `github.com/caddy-dns/cloudflare`

            Download `caddy-linux-amd64` directly on the VPS, then verify it with `SHA256SUMS`.
          prerelease: false
          make_latest: true
          files: |
            caddy-linux-amd64
            SHA256SUMS
